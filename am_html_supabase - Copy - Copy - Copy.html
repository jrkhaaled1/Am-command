const fhr=h=>`${h%12===0?12:h%12}${h<12?"am":"pm"}`;

function wdays(w=0){const s=sunOf(w);return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);});}

function gcalLink(t,date,aName){
  const base="https://calendar.google.com/calendar/render?action=TEMPLATE";
  const title=encodeURIComponent(`[AM] ${t.text} — ${aName}`);
  const desc=encodeURIComponent(`Account: ${aName}`);
  if(t.time){const[hh,mm]=t.time.split(":");const s=new Date(`${date}T${hh}:${mm}:00`);const e=new Date(s.getTime()+3600000);const fmt=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";return `${base}&text=${title}&details=${desc}&dates=${fmt(s)}/${fmt(e)}`;}
  const d=date.replace(/-/g,"");return `${base}&text=${title}&details=${desc}&dates=${d}/${d}`;
}

// InsurerLogo
function InsurerLogo({ins,size="sm"}){
  const[err,setErr]=useState(false);
  if(!ins)return null;
  const dim=size==="sm"?28:40;
  const r=size==="sm"?6:8;
  if(ins.logo&&!err)return <img src={ins.logo} alt={ins.name} className={size==="sm"?"ins-logo-sm":"ins-logo"} onError={()=>setErr(true)}/>;
  return <div style={{width:dim,height:dim,borderRadius:r,background:ac(ins.name),display:"flex",alignItems:"center",justifyContent:"center",fontSize:size==="sm"?9:11,fontWeight:700,color:"#fff",flexShrink:0}}>{ii(ins.name)}</div>;
}

// ── Main Dashboard ────────────────────────────────────────────────────────────
function Dashboard(){
  const[data,setData]=useState(()=>{try{const s=localStorage.getItem(LOCAL_KEY);return s?JSON.parse(s):initData();}catch{return initData();}});
  const[syncOk,setSyncOk]=useState(null);
  const[syncMsg,setSyncMsg]=useState("Connecting…");
  const[view,setView]=useState("overview");
  const[selAcc,setSelAcc]=useState(null);
  const[calOff,setCalOff]=useState(0);
  const[nOff,setNOff]=useState(0);
  const[dOff,setDOff]=useState(0);
  const[showAdd,setShowAdd]=useState(false);
  const[showEdit,setShowEdit]=useState(false);
  const[form,setForm]=useState(flatA(eAcc()));
  const[note,setNote]=useState("");
  const[task,setTask]=useState("");
  const[taskTime,setTaskTime]=useState("");
  const[tab,setTab]=useState("notes");
  const[calDay,setCalDay]=useState(td());
  const[search,setSearch]=useState("");
  const[insSearch,setInsSearch]=useState("");
  const[showRen,setShowRen]=useState(false);
  const[showCalAdd,setShowCalAdd]=useState(false);
  const[calTask,setCalTask]=useState({text:"",time:"",accId:""});
  const[showSub,setShowSub]=useState(false);
  const[subForm,setSubForm]=useState({name:"",employees:"",poc:"",pocEmail:"",pocPhone:""});
  const[insFilter,setInsFilter]=useState("all");
  const[copiedId,setCopiedId]=useState(null);
  // task action
  const[taskAction,setTaskAction]=useState(null); // {mode,task,accId,dayK}
  // insurer modal
  const[insModal,setInsModal]=useState(null); // {mode:'add'|'edit', insurer}
  const[insForm,setInsForm]=useState({name:"",logo:"",url:"",types:[]});
  // renewal update
  const[renewalInput,setRenewalInput]=useState({}); // {accId: text}
  const[secureModal,setSecureModal]=useState(null); // acc object

  const syncTimer=useRef(null);
  const mounted=useRef(true);
  useEffect(()=>()=>{mounted.current=false;},[]);

  // Combine builtin + custom insurers
  const allInsurers=[...BUILTIN_INSURERS,...(data.customInsurers||[])];
  const insurerById={};
  allInsurers.forEach(i=>insurerById[i.id]=i);

  useEffect(()=>{
    (async()=>{
      try{
        const res=await fetch(`${SUPABASE_URL}/rest/v1/am_data?id=eq.main&select=payload`,{headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"}});
        const rows=await res.json();
        if(rows&&rows[0]?.payload&&mounted.current){setData(rows[0].payload);localStorage.setItem(LOCAL_KEY,JSON.stringify(rows[0].payload));setSyncOk(true);setSyncMsg("Synced ✓");}
        else{await pushREST(data);setSyncOk(true);setSyncMsg("Synced ✓");}
      }catch{setSyncOk(false);setSyncMsg("Offline — local only");}
    })();
  },[]);

  async function pushREST(nd){await fetch(`${SUPABASE_URL}/rest/v1/am_data`,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},body:JSON.stringify({id:"main",payload:nd,updated_at:new Date().toISOString()})});}

  const push=useCallback(nd=>{setSyncOk(null);setSyncMsg("Saving…");clearTimeout(syncTimer.current);syncTimer.current=setTimeout(async()=>{try{await pushREST(nd);if(mounted.current){setSyncOk(true);setSyncMsg("Synced ✓");}}catch{if(mounted.current){setSyncOk(false);setSyncMsg("Sync failed");}}},600);},[]);
  const save=useCallback(fn=>{setData(d=>{const n={...d,...fn(d)};localStorage.setItem(LOCAL_KEY,JSON.stringify(n));push(n);return n;});},[push]);
  const log=useCallback((id,msg)=>{save(d=>({accounts:d.accounts.map(a=>a.id===id?{...a,activity:[{id:Date.now(),msg,ts:new Date().toISOString()},...(a.activity||[])].slice(0,50)}:a)}));},[save]);

  const chForm=useCallback((k,v)=>setForm(f=>({...f,[k]:v})),[]);
  const chCal=useCallback((k,v)=>setCalTask(f=>({...f,[k]:v})),[]);
  const chNote=useCallback(v=>setNote(v),[]);
  const chTask=useCallback(v=>setTask(v),[]);
  const chTaskTime=useCallback(v=>setTaskTime(v),[]);
  const chIns=useCallback((k,v)=>setInsForm(f=>({...f,[k]:v})),[]);

  const acc=selAcc?data.accounts.find(a=>a.id===selAcc):null;
  const nwk=wkf(nOff);
  const dky=dkf(dOff);
  const fAccs=data.accounts.filter(a=>!search||[a.name,a.poc.name,a.industry].some(x=>x.toLowerCase().includes(search.toLowerCase())));
  const ren=data.accounts.filter(a=>{if(!a.renewalDate)return false;const diff=(new Date(a.renewalDate)-new Date())/86400000;return diff>=0&&diff<=60;}).sort((a,b)=>new Date(a.renewalDate)-new Date(b.renewalDate));
  const totalOpen=data.accounts.flatMap(a=>Object.values(a.tasks||{}).flat()).filter(t=>!t.done&&!t.ended).length;
  const atRisk=data.accounts.filter(a=>a.status==="risk").length;
  const filteredInsurers=allInsurers.filter(i=>{
    const mt=insFilter==="all"||(insFilter==="carrier"&&i.types.includes("carrier"))||(insFilter==="tpa"&&i.types.includes("tpa"))||(insFilter==="hmo"&&i.types.includes("hmo"));
    const ms=!insSearch||i.name.toLowerCase().includes(insSearch.toLowerCase());
    return mt&&ms;
  });

  function addAcc(){if(!form.name.trim())return;const id=data.nextId;save(d=>({accounts:[...d.accounts,{...unflat(form),id,subsidiaries:[],notes:{},tasks:{},activity:[{id:Date.now(),msg:"Account created",ts:new Date().toISOString()}],renewalUpdates:[]}],nextId:d.nextId+1}));setForm(flatA(eAcc()));setShowAdd(false);}
  function updAcc(){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...acc,...unflat(form)}:a)}));log(acc.id,"Account updated");setShowEdit(false);}
  function delAcc(id){if(!window.confirm("Delete?"))return;save(d=>({accounts:d.accounts.filter(a=>a.id!==id)}));setSelAcc(null);}
  function addSub(){if(!subForm.name.trim()||!acc)return;const sub={id:Date.now(),...subForm,employees:parseInt(subForm.employees)||0};save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,subsidiaries:[...(a.subsidiaries||[]),sub]}:a)}));log(acc.id,`Subsidiary: "${subForm.name}"`);setSubForm({name:"",employees:"",poc:"",pocEmail:"",pocPhone:""});setShowSub(false);}
  function delSub(sid){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,subsidiaries:(a.subsidiaries||[]).filter(s=>s.id!==sid)}:a)}));}

  const saveNote=useCallback(()=>{if(!note.trim()||!acc)return;save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,notes:{...a.notes,[nwk]:[...(a.notes[nwk]||[]),{id:Date.now(),text:note,ts:new Date().toISOString()}]}}:a)}));log(acc.id,`Note: "${note.slice(0,40)}"`);setNote("");},[note,acc,nwk,save,log]);
  function delNote(nid){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,notes:{...a.notes,[nwk]:(a.notes[nwk]||[]).filter(n=>n.id!==nid)}}:a)}));}

  const addTask=useCallback(()=>{if(!task.trim()||!acc)return;save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,tasks:{...a.tasks,[dky]:[...(a.tasks[dky]||[]),{id:Date.now(),text:task,time:taskTime,done:false,ended:false,updates:[]}]}}:a)}));log(acc.id,`Task: "${task.slice(0,40)}"`);setTask("");setTaskTime("");},[task,taskTime,acc,dky,save,log]);

  // Task actions
  function endTask(tid,dy,aid){
    const ta=aid||acc?.id,tdy=dy||dky;
    save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).map(t=>t.id===tid?{...t,done:true,ended:true}:t)}}:a)}));
    log(ta,"Task ended ✓");
  }
  function togTask(tid,dy,aid){const ta=aid||acc?.id,tdy=dy||dky;save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)}}:a)}));}
  function delTask(tid,dy,aid){const ta=aid||acc?.id,tdy=dy||dky;save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).filter(t=>t.id!==tid)}}:a)}));}

  function handleTaskUpdate(updateText){
    const{task:t,accId:ta,dayK:tdy}=taskAction;
    save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).map(tk=>tk.id===t.id?{...tk,updates:[...(tk.updates||[]),{text:updateText,ts:new Date().toISOString()}]}:tk)}}:a)}));
    log(ta,`Task update: "${updateText.slice(0,40)}"`);setTaskAction(null);
  }
  function handleAddRelated(text,aId,time){
    const today=td();
    save(d=>({accounts:d.accounts.map(a=>a.id===aId?{...a,tasks:{...a.tasks,[today]:[...(a.tasks[today]||[]),{id:Date.now(),text,time,done:false,ended:false,updates:[]}]}}:a)}));
    log(aId,`Related task added: "${text.slice(0,40)}"`);setTaskAction(null);
  }

  const addCalTask=useCallback(()=>{if(!calTask.text.trim()||!calTask.accId)return;const aId=parseInt(calTask.accId);save(d=>({accounts:d.accounts.map(a=>a.id===aId?{...a,tasks:{...a.tasks,[calDay]:[...(a.tasks[calDay]||[]),{id:Date.now(),text:calTask.text,time:calTask.time,done:false,ended:false,updates:[]}]}}:a)}));log(aId,`Cal task: "${calTask.text.slice(0,40)}"`);setCalTask({text:"",time:"",accId:""});setShowCalAdd(false);},[calTask,calDay,save,log]);

  // Insurer CRUD
  function saveInsurer(){
    if(!insForm.name.trim()||(insForm.types||[]).length===0){alert("Name and at least one type required.");return;}
    if(insModal.mode==="add"){

          {t.time&&!t.ended&&<span style={{fontSize:11,color:"#0fa890",fontWeight:700,background:"#e8faf8",padding:"1px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{t.time}</span>}

  // ── Account logo helper ───────────────────────────────────────────────────
  function AccAvatar({a,size=33}){

    if(a.logoUrl&&!err)return <img src={a.logoUrl} alt={a.name} style={{width:size,height:size,objectFit:"contain",borderRadius:size>35?10:8,background:"#f7fbff",border:"1px solid #edf2f7",padding:3,flexShrink:0}} onError={()=>setErr(true)}/>;
    return <div style={{...c.ava(a.name),width:size,height:size,fontSize:size>35?13:11}}>{ii(a.name)}</div>;
  }

  function InsurerTags({a}){
    const carrier=a.carrierId?insurerById[a.carrierId]:null;

                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:"14px 18px"}}>
                  {[["Employees",acc.employees.toLocaleString()],["Status",null],["Renewal",acc.renewalDate?new Date(acc.renewalDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—"],["Days left",acc.renewalDate?Math.max(0,Math.ceil((new Date(acc.renewalDate)-new Date())/86400000))+"d":"—"]].map(([l,v])=>(
                    <div key={l} style={c.ic}><div style={c.iL}>{l}</div>{l==="Status"?<div style={{marginTop:4}}><span style={c.badge(acc.status)}>{SC[acc.status]?.label}</span></div>:<div style={c.iV}>{v}</div>}</div>
                  ))}
                </div>

                {/* Insurance card */}
                {(acc.carrierId||acc.tpaId||acc.hmoId)&&(
                  <div style={{margin:"0 18px 14px",background:"#f0f6ff",border:"1px solid #c7dcff",borderRadius:12,padding:14}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#4285f4",textTransform:"uppercase",letterSpacing:0.8,marginBottom:10}}>Insurance Setup</div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                      {acc.carrierId&&insurerById[acc.carrierId]&&(()=>{const ins=insurerById[acc.carrierId];return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #c7dcff",borderRadius:10,padding:"8px 12px",minWidth:120}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#4285f4",textTransform:"uppercase"}}>Risk Carrier</div><div style={{fontSize:12,fontWeight:700}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#4285f4",textDecoration:"none"}}>Visit →</a>}</div>
                        </div>
                      );})()}
                      {(acc.tpaIsCarrier?acc.carrierId:acc.tpaId)&&(()=>{const ins=acc.tpaIsCarrier?insurerById[acc.carrierId]:insurerById[acc.tpaId];if(!ins)return null;return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #b2f0df",borderRadius:10,padding:"8px 12px",minWidth:120}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#0fa890",textTransform:"uppercase"}}>TPA{acc.tpaIsCarrier?" (= Carrier)":""}</div><div style={{fontSize:12,fontWeight:700}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#0fa890",textDecoration:"none"}}>Visit →</a>}</div>
                        </div>
                      );})()}
                      {acc.hmoId&&insurerById[acc.hmoId]&&(()=>{const ins=insurerById[acc.hmoId];return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #e9c7ff",borderRadius:10,padding:"8px 12px",minWidth:120}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#9333ea",textTransform:"uppercase"}}>HMO</div><div style={{fontSize:12,fontWeight:700}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#9333ea",textDecoration:"none"}}>Visit →</a>}</div>
                        </div>
                      );})()}
                    </div>
                  </div>
                )}

                {/* POC */}
                <div style={{margin:"0 18px 14px",background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:12,padding:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                    <div style={{...c.ava(acc.poc.name||"?"),width:44,height:44,fontSize:14}}>{ii(acc.poc.name||"?")}</div>
                    <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>{acc.poc.name||"—"}</div><div style={{fontSize:12,color:"#7a9ab5"}}>{acc.poc.title||"—"}</div></div>
                    <div style={{display:"flex",gap:6}}>
                      {acc.poc.email&&<a href={`mailto:${acc.poc.email}`} style={{background:"#e8faf8",border:"1px solid #5dd8c844",color:"#0fa890",borderRadius:8,padding:"5px 11px",fontSize:12,fontWeight:700,textDecoration:"none"}}>✉ Email</a>}
                      {acc.poc.emailThreadUrl&&<a href={acc.poc.emailThreadUrl} target="_blank" rel="noopener noreferrer" style={{background:"#0a1628",border:"1px solid #162240",color:"#5dd8c8",borderRadius:8,padding:"5px 11px",fontSize:12,fontWeight:700,textDecoration:"none"}}>📬 Inbox</a>}
                    </div>
                  </div>
                  {[["Phone",acc.poc.phone,null],["Email",acc.poc.email,acc.poc.email?`mailto:${acc.poc.email}`:null]].map(([l,v,href])=>(
                    <div key={l} style={{fontSize:12,color:"#7a9ab5",padding:"6px 0",borderTop:"1px solid #edf2f7",display:"flex",gap:8}}>
                      <span style={{color:"#c0cdd8",minWidth:42,fontWeight:600}}>{l}</span>
                      {href?<a href={href} style={{color:"#0fa890",fontWeight:600,textDecoration:"none"}}>{v||"—"}</a>:<span style={{color:"#0f1c2e",fontWeight:500}}>{v||"—"}</span>}
                    </div>
                  ))}
                </div>

                {/* Subsidiaries */}
                <div style={{margin:"0 18px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#7a9ab5",textTransform:"uppercase",letterSpacing:0.8}}>Subsidiaries ({(acc.subsidiaries||[]).length})</span>
                    <button style={c.aBtn} onClick={()=>setShowSub(true)}>+ Add</button>
                  </div>
                  {(acc.subsidiaries||[]).length===0?<div style={{background:"#f7fbff",border:"1px dashed #dde8f0",borderRadius:10,padding:12,textAlign:"center",color:"#c0cdd8",fontSize:12}}>No subsidiaries yet.</div>
                  :(acc.subsidiaries||[]).map(s=>(
                    <div key={s.id} style={{background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>
                      <div style={{...c.ava(s.name),width:30,height:30,fontSize:10}}>{ii(s.name)}</div>
                      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{s.name}</div><div style={{fontSize:11,color:"#7a9ab5"}}>{s.employees>0?`${s.employees} emp.`:""}{s.poc?` · ${s.poc}`:""}</div></div>
                      {s.pocEmail&&<a href={`mailto:${s.pocEmail}`} style={{fontSize:11,color:"#0fa890",fontWeight:700,textDecoration:"none",background:"#e8faf8",padding:"2px 8px",borderRadius:20}}>✉</a>}
                      <button style={c.del} onClick={()=>delSub(s.id)}>✕</button>
                    </div>
                  ))}
                </div>

                <div style={c.tabs}>
                  {[["notes","Weekly Notes"],["tasks","Daily Tasks"],["activity","Activity Log"]].map(([t,l])=>(
                    <button key={t} style={c.tab(tab===t)} onClick={()=>setTab(t)}>{l}</button>
                  ))}
                </div>

                {tab==="notes"&&(
                  <div style={{padding:18}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <span style={{fontSize:13,fontWeight:600}}>Week notes</span>
                      <WeekNav off={nOff} setOff={setNOff} label={nOff===0?"This week":nOff===-1?"Last week":nOff<0?`${Math.abs(nOff)}w ago`:`${nOff}w ahead`}/>
                    </div>
                    <NoteInput value={note} onChange={chNote} onSave={saveNote}/>
                    {(acc.notes[nwk]||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No notes this week.</div>
                    :[...(acc.notes[nwk]||[])].reverse().map(n=>(
                      <div key={n.id} style={{background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:8,padding:12,marginTop:8,position:"relative"}}>
                        <button style={c.del} onClick={()=>delNote(n.id)}>✕</button>
                        <div style={{fontSize:13,lineHeight:1.65,color:"#0f1c2e",paddingRight:20}}>{n.text}</div>
                        <div style={{fontSize:11,color:"#c0cdd8",marginTop:5}}>{new Date(n.ts).toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"})}</div>
                      </div>
                    ))}
                  </div>
                )}

                {tab==="tasks"&&(
                  <div style={{padding:18}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <span style={{fontSize:13,fontWeight:600}}>{fday(dky)}</span>
                      <WeekNav off={dOff} setOff={setDOff} label={dOff===0?"Today":dOff===1?"Tomorrow":dOff===-1?"Yesterday":dOff<0?`${Math.abs(dOff)}d ago`:`In ${dOff}d`}/>
                    </div>
                    <TaskInput value={task} timeValue={taskTime} onChange={chTask} onTimeChange={chTaskTime} onAdd={addTask}/>
                    {(acc.tasks[dky]||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No tasks for this day.</div>
                    :[...(acc.tasks[dky]||[])].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")).map(t=>(
                      <TaskRow key={t.id} t={t} dy={dky} aid={acc.id} aName={acc.name}/>
                    ))}
                  </div>
                )}

                {tab==="activity"&&(
                  <div style={{padding:18}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:12,color:"#7a9ab5"}}>Activity & task log</div>
                    {(acc.activity||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No activity yet.</div>
                    :(acc.activity||[]).map(a=>(
                      <div key={a.id} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:"1px solid #f0f4f8",alignItems:"flex-start"}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:"#edf2f7",border:"1.5px solid #5dd8c8",marginTop:5,flexShrink:0}}/>
                        <div style={{flex:1}}><div style={{fontSize:13,color:"#0f1c2e",fontWeight:500}}>{a.msg}</div><div style={{fontSize:11,color:"#c0cdd8",marginTop:2}}>{new Date(a.ts).toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"})}</div></div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ══ INSURERS ══ */}
        {view==="insurers"&&(
          <div>
            <div style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,padding:"14px 18px",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <input style={{...c.srch,marginBottom:0,maxWidth:240}} placeholder="Search insurers…" value={insSearch} onChange={e=>setInsSearch(e.target.value)}/>
                <div style={{display:"flex",gap:6}}>
                  {[["all","All"],["carrier","Risk Carriers"],["tpa","TPAs"],["hmo","HMOs"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setInsFilter(v)} style={{background:insFilter===v?"#0a1628":"#f0f4f8",color:insFilter===v?"#5dd8c8":"#7a9ab5",border:"none",borderRadius:8,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{l}</button>
                  ))}
                </div>
                <button style={{...c.aBtn,marginLeft:"auto"}} onClick={()=>{setInsForm({name:"",logo:"",url:"",types:[]});setInsModal({mode:"add"});}}>+ Add insurer</button>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              {[["Risk Carriers",allInsurers.filter(i=>i.types.includes("carrier")).length,"#4285f4"],["TPAs",allInsurers.filter(i=>i.types.includes("tpa")).length,"#0fa890"],["HMOs",allInsurers.filter(i=>i.types.includes("hmo")).length,"#9333ea"]].map(([l,v,col])=>(
                <div key={l} style={{background:"#fff",border:`1.5px solid ${col}44`,borderRadius:14,padding:"14px 18px"}}>
                  <div style={{fontSize:22,fontWeight:700,color:col,fontFamily:"'Clash Display',sans-serif"}}>{v}</div>
                  <div style={{fontSize:11,color:"#7a9ab5",marginTop:2,textTransform:"uppercase",letterSpacing:0.8,fontWeight:600}}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
              {filteredInsurers.map(ins=>{
                const linked=data.accounts.filter(a=>a.carrierId===ins.id||a.tpaId===ins.id||(a.tpaIsCarrier&&a.carrierId===ins.id)||a.hmoId===ins.id);
                return(
                  <div key={ins.id} style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <InsurerLogo ins={ins}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:700,fontFamily:"'Clash Display',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ins.name}</div>
                        <div style={{display:"flex",gap:3,marginTop:3,flexWrap:"wrap"}}>
                          {ins.types.map(t=><span key={t} style={c.typeTag(t)}>{t==="carrier"?"Risk Carrier":t==="tpa"?"TPA":"HMO"}</span>)}
                          {!ins.builtin&&<span style={{fontSize:9,background:"#f3f0ff",color:"#a78bfa",borderRadius:20,padding:"2px 7px",fontWeight:700}}>Custom</span>}
                        </div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:4}}>
                        {ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#4285f4",fontWeight:700,textDecoration:"none",background:"#e8f0fe",padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>Website →</a>}
                        {!ins.builtin&&<>
                          <button onClick={()=>{setInsForm({name:ins.name,logo:ins.logo||"",url:ins.url||"",types:ins.types});setInsModal({mode:"edit",insurer:ins});}} style={{fontSize:10,color:"#d4880a",fontWeight:700,background:"#fff8e6",border:"none",borderRadius:20,padding:"2px 8px",cursor:"pointer"}}>Edit</button>
                          <button onClick={()=>delInsurer(ins.id)} style={{fontSize:10,color:"#e0392e",fontWeight:700,background:"#fff0ef",border:"none",borderRadius:20,padding:"2px 8px",cursor:"pointer"}}>Delete</button>
                        </>}
                      </div>
                    </div>
                    {linked.length>0&&(
                      <div>
                        <div style={{fontSize:10,fontWeight:700,color:"#7a9ab5",textTransform:"uppercase",letterSpacing:0.5,marginBottom:5}}>Linked accounts ({linked.length})</div>
                        {linked.map(a=>(
                          <div key={a.id} onClick={()=>{setSelAcc(a.id);setView("accounts");}} style={{display:"flex",alignItems:"center",gap:8,background:"#f7fbff",borderRadius:8,padding:"5px 10px",cursor:"pointer",border:"1px solid #edf2f7",marginBottom:4}}>
                            <AccAvatar a={a} size={20}/>
                            <span style={{fontSize:12,fontWeight:600,flex:1}}>{a.name}</span>
                            <span style={{...c.badge(a.status),fontSize:9,padding:"1px 6px"}}>{SC[a.status]?.label}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {linked.length===0&&<div style={{fontSize:11,color:"#c0cdd8",textAlign:"center"}}>No accounts linked</div>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* ── Modals ── */}
      {showAdd&&<AccModal title="Add new account" d={form} ch={chForm} allInsurers={allInsurers} onSave={addAcc} onClose={()=>setShowAdd(false)}/>}
      {showEdit&&<AccModal title={`Edit · ${acc?.name}`} d={form} ch={chForm} allInsurers={allInsurers} onSave={updAcc} onClose={()=>setShowEdit(false)}/>}
      {showCalAdd&&<CalAddModal day={calDay} accounts={data.accounts} ct={calTask} ch={chCal} onSave={addCalTask} onClose={()=>setShowCalAdd(false)}/>}
      {insModal&&<InsurerFormModal title={insModal.mode==="add"?"Add Insurer":"Edit Insurer"} d={insForm} ch={chIns} onSave={saveInsurer} onClose={()=>setInsModal(null)}/>}
      {secureModal&&<RenewalSecuredModal acc={secureModal} allInsurers={allInsurers} onClose={()=>setSecureModal(null)} onSecure={(details)=>secureRenewal(secureModal.id,details)}/>}
      {taskAction&&<TaskActionModal mode={taskAction.mode} task={taskAction.task} accounts={data.accounts} accId={taskAction.accId} onClose={()=>setTaskAction(null)} onSubmit={taskAction.mode==="update"?handleTaskUpdate:handleAddRelated}/>}
      {showSub&&(
        <div style={c.modal} onClick={e=>e.target===e.currentTarget&&setShowSub(false)}>
          <div style={{...c.mBox,width:400}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4,fontFamily:"'Clash Display',sans-serif"}}>Add Subsidiary</div>
            <div style={{fontSize:12,color:"#7a9ab5",marginBottom:16}}>Under {acc?.name}</div>
            {[["Subsidiary name","name","text"],["Employees","employees","number"],["POC name","poc","text"],["POC email","pocEmail","email"],["POC phone","pocPhone","text"]].map(([lb,k,t])=>(
              <div key={k}><label style={c.fl}>{lb}</label><input style={c.fi} type={t} value={subForm[k]} onChange={e=>setSubForm(f=>({...f,[k]:e.target.value}))}/></div>
            ))}
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:10}}>
              <button style={c.cBtn} onClick={()=>setShowSub(false)}>Cancel</button>
              <button style={c.sv} onClick={addSub}>Add</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard/>);
</script>
</body>

const AP=["#1565c0","#4527a0","#00695c","#6a1b9a","#ad1457","#0277bd","#00838f","#558b2f"];
const ac=n=>AP[n.charCodeAt(0)%AP.length];
const ii=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const td=()=>new Date().toISOString().slice(0,10);
const dkf=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10);};
const wkf=off=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+off*7);return d.toISOString().slice(0,10);};
const fday=k=>new Date(k).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
const HRS=Array.from({length:10},(_,i)=>i+9);
const fhr=h=>`${h%12===0?12:h%12}${h<12?"am":"pm"}`;
function sunOf(w=0){const d=new Date();d.setDate(d.getDate()-d.getDay()+w*7);d.setHours(0,0,0,0);return d;}
function wdays(w=0){const s=sunOf(w);return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10);});}
function eAcc(){return{name:"",industry:"",employees:"",subsidiaries:[],poc:{name:"",title:"",phone:"",email:"",emailThreadUrl:""},renewalDate:"",status:"healthy",carrierId:"",tpaId:"",tpaIsCarrier:false,hmoId:""};}
function flatA(a){return{name:a.name||"",industry:a.industry||"",employees:String(a.employees||""),renewalDate:a.renewalDate||"",status:a.status||"healthy",pn:a.poc?.name||"",pt:a.poc?.title||"",pp:a.poc?.phone||"",pe:a.poc?.email||"",pu:a.poc?.emailThreadUrl||"",carrierId:a.carrierId||"",tpaId:a.tpaId||"",tpaIsCarrier:a.tpaIsCarrier||false,hmoId:a.hmoId||""};}
function unflat(f){return{name:f.name,industry:f.industry,employees:parseInt(f.employees)||0,renewalDate:f.renewalDate,status:f.status,poc:{name:f.pn,title:f.pt,phone:f.pp,email:f.pe,emailThreadUrl:f.pu},carrierId:f.carrierId||"",tpaId:f.tpaId||"",tpaIsCarrier:f.tpaIsCarrier||false,hmoId:f.hmoId||""};}

function gcalLink(t,date,aName){
  const base="https://calendar.google.com/calendar/render?action=TEMPLATE";
  const title=encodeURIComponent(`[AM] ${t.text} — ${aName}`);
  const desc=encodeURIComponent(`Account: ${aName}`);
  if(t.time){
    const[hh,mm]=t.time.split(":");
    const s=new Date(`${date}T${hh}:${mm}:00`);
    const e=new Date(s.getTime()+3600000);
    const fmt=d=>d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    return `${base}&text=${title}&details=${desc}&dates=${fmt(s)}/${fmt(e)}`;
  }
  const d=date.replace(/-/g,"");
  return `${base}&text=${title}&details=${desc}&dates=${d}/${d}`;
}
function copyAndOpenTasks(text){
  navigator.clipboard.writeText(text).then(()=>{
    window.open("https://tasks.google.com/tasks/","_blank");
  }).catch(()=>{
    window.open("https://tasks.google.com/tasks/","_blank");
  });
}

}

  const tpa=acc.tpaIsCarrier?carrier:(acc.tpaId?INSURER_BY_ID[acc.tpaId]:null);
  const hmo=acc.hmoId?INSURER_BY_ID[acc.hmoId]:null;
  if(!carrier&&!tpa&&!hmo)return null;
  return(
    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>
      {carrier&&<div style={{display:"flex",alignItems:"center",gap:4,background:"#e8f0fe",borderRadius:20,padding:"2px 8px 2px 4px",fontSize:10,fontWeight:600,color:"#4285f4"}}>
        <InsurerLogo ins={carrier} size="xs"/>
        <span style={{marginLeft:2}}>{carrier.name}</span>
      </div>}
      {tpa&&tpa.id!==carrier?.id&&<div style={{display:"flex",alignItems:"center",gap:4,background:"#e8faf5",borderRadius:20,padding:"2px 8px 2px 4px",fontSize:10,fontWeight:600,color:"#0fa890"}}>
        <InsurerLogo ins={tpa} size="xs"/>
        <span style={{marginLeft:2}}>{tpa.name}</span>
      </div>}
      {acc.tpaIsCarrier&&carrier&&<span style={{background:"#e8faf5",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:600,color:"#0fa890"}}>TPA: Same as Carrier</span>}
      {hmo&&<div style={{display:"flex",alignItems:"center",gap:4,background:"#fce8ff",borderRadius:20,padding:"2px 8px 2px 4px",fontSize:10,fontWeight:600,color:"#9333ea"}}>
        <InsurerLogo ins={hmo} size="xs"/>
        <span style={{marginLeft:2}}>{hmo.name}</span>
      </div>}
    </div>
  );
}

// ── Main Dashboard ────────────────────────────────────────────────────────────
function Dashboard(){
  const[data,setData]=useState(()=>{try{const s=localStorage.getItem(LOCAL_KEY);return s?JSON.parse(s):initData();}catch{return initData();}});
  const[syncOk,setSyncOk]=useState(null);
  const[syncMsg,setSyncMsg]=useState("Connecting…");
  const[view,setView]=useState("overview");
  const[selAcc,setSelAcc]=useState(null);
  const[calOff,setCalOff]=useState(0);
  const[nOff,setNOff]=useState(0);
  const[dOff,setDOff]=useState(0);
  const[showAdd,setShowAdd]=useState(false);
  const[showEdit,setShowEdit]=useState(false);
  const[form,setForm]=useState(flatA(eAcc()));
  const[note,setNote]=useState("");
  const[task,setTask]=useState("");
  const[taskTime,setTaskTime]=useState("");
  const[tab,setTab]=useState("notes");
  const[calDay,setCalDay]=useState(td());
  const[search,setSearch]=useState("");
  const[insSearch,setInsSearch]=useState("");
  const[showRen,setShowRen]=useState(false);
  const[showCalAdd,setShowCalAdd]=useState(false);
  const[calTask,setCalTask]=useState({text:"",time:"",accId:""});
  const[showSub,setShowSub]=useState(false);
  const[subForm,setSubForm]=useState({name:"",employees:"",poc:"",pocEmail:"",pocPhone:""});
  const[insFilter,setInsFilter]=useState("all"); // all|carrier|tpa|hmo
  const[copiedId,setCopiedId]=useState(null);

  const syncTimer=useRef(null);
  const mounted=useRef(true);
  useEffect(()=>()=>{mounted.current=false;},[]);

  useEffect(()=>{
    (async()=>{
      try{
        const res=await fetch(`${SUPABASE_URL}/rest/v1/am_data?id=eq.main&select=payload`,{
          headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"}
        });
        const rows=await res.json();
        if(rows&&rows[0]?.payload&&mounted.current){
          setData(rows[0].payload);
          localStorage.setItem(LOCAL_KEY,JSON.stringify(rows[0].payload));
          setSyncOk(true);setSyncMsg("Synced ✓");
        } else {
          await pushREST(data);
          setSyncOk(true);setSyncMsg("Synced ✓");
        }
      }catch(e){setSyncOk(false);setSyncMsg("Offline — local only");}
    })();
  },[]);

  async function pushREST(nd){
    await fetch(`${SUPABASE_URL}/rest/v1/am_data`,{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({id:"main",payload:nd,updated_at:new Date().toISOString()})
    });
  }

  const push=useCallback(nd=>{
    setSyncOk(null);setSyncMsg("Saving…");
    clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(async()=>{
      try{await pushREST(nd);if(mounted.current){setSyncOk(true);setSyncMsg("Synced ✓");}}
      catch{if(mounted.current){setSyncOk(false);setSyncMsg("Sync failed");}}
    },600);
  },[]);

  const save=useCallback(fn=>{
    setData(d=>{const n={...d,...fn(d)};localStorage.setItem(LOCAL_KEY,JSON.stringify(n));push(n);return n;});
  },[push]);

  const log=useCallback((id,msg)=>{
    save(d=>({accounts:d.accounts.map(a=>a.id===id?{...a,activity:[{id:Date.now(),msg,ts:new Date().toISOString()},...(a.activity||[])].slice(0,50)}:a)}));
  },[save]);

  const chForm=useCallback((k,v)=>setForm(f=>({...f,[k]:v})),[]);
  const chCal=useCallback((k,v)=>setCalTask(f=>({...f,[k]:v})),[]);
  const chNote=useCallback(v=>setNote(v),[]);
  const chTask=useCallback(v=>setTask(v),[]);
  const chTaskTime=useCallback(v=>setTaskTime(v),[]);

  const acc=selAcc?data.accounts.find(a=>a.id===selAcc):null;
  const nwk=wkf(nOff);
  const dky=dkf(dOff);
  const fAccs=data.accounts.filter(a=>!search||[a.name,a.poc.name,a.industry].some(x=>x.toLowerCase().includes(search.toLowerCase())));
  const ren=data.accounts.filter(a=>{if(!a.renewalDate)return false;const diff=(new Date(a.renewalDate)-new Date())/86400000;return diff>=0&&diff<=60;}).sort((a,b)=>new Date(a.renewalDate)-new Date(b.renewalDate));
  const totalOpen=data.accounts.flatMap(a=>Object.values(a.tasks||{}).flat()).filter(t=>!t.done).length;
  const atRisk=data.accounts.filter(a=>a.status==="risk").length;

  function addAcc(){if(!form.name.trim())return;const id=data.nextId;save(d=>({accounts:[...d.accounts,{...unflat(form),id,subsidiaries:[],notes:{},tasks:{},activity:[{id:Date.now(),msg:"Account created",ts:new Date().toISOString()}]}],nextId:d.nextId+1}));setForm(flatA(eAcc()));setShowAdd(false);}
  function updAcc(){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...acc,...unflat(form)}:a)}));log(acc.id,"Account updated");setShowEdit(false);}
  function delAcc(id){if(!window.confirm("Delete?"))return;save(d=>({accounts:d.accounts.filter(a=>a.id!==id)}));setSelAcc(null);}
  function addSub(){if(!subForm.name.trim()||!acc)return;const sub={id:Date.now(),...subForm,employees:parseInt(subForm.employees)||0};save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,subsidiaries:[...(a.subsidiaries||[]),sub]}:a)}));log(acc.id,`Subsidiary: "${subForm.name}"`);setSubForm({name:"",employees:"",poc:"",pocEmail:"",pocPhone:""});setShowSub(false);}
  function delSub(sid){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,subsidiaries:(a.subsidiaries||[]).filter(s=>s.id!==sid)}:a)}));}

  const saveNote=useCallback(()=>{
    if(!note.trim()||!acc)return;
    save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,notes:{...a.notes,[nwk]:[...(a.notes[nwk]||[]),{id:Date.now(),text:note,ts:new Date().toISOString()}]}}:a)}));
    log(acc.id,`Note: "${note.slice(0,40)}"`);setNote("");
  },[note,acc,nwk,save,log]);

  function delNote(nid){save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,notes:{...a.notes,[nwk]:(a.notes[nwk]||[]).filter(n=>n.id!==nid)}}:a)}));}

  const addTask=useCallback(()=>{
    if(!task.trim()||!acc)return;
    save(d=>({accounts:d.accounts.map(a=>a.id===acc.id?{...a,tasks:{...a.tasks,[dky]:[...(a.tasks[dky]||[]),{id:Date.now(),text:task,time:taskTime,done:false}]}}:a)}));
    log(acc.id,`Task: "${task.slice(0,40)}"`);setTask("");setTaskTime("");
  },[task,taskTime,acc,dky,save,log]);

  function togTask(tid,dy,aid){const ta=aid||acc?.id,tdy=dy||dky,tac=data.accounts.find(a=>a.id===ta),t=(tac?.tasks[tdy]||[]).find(t=>t.id===tid);save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)}}:a)}));if(t)log(ta,t.done?`Unchecked: "${t.text.slice(0,30)}"`:` Done: "${t.text.slice(0,30)}"`);}
  function delTask(tid,dy,aid){const ta=aid||acc?.id,tdy=dy||dky;save(d=>({accounts:d.accounts.map(a=>a.id===ta?{...a,tasks:{...a.tasks,[tdy]:(a.tasks[tdy]||[]).filter(t=>t.id!==tid)}}:a)}));}

  const addCalTask=useCallback(()=>{
    if(!calTask.text.trim()||!calTask.accId)return;
    const aId=parseInt(calTask.accId);
    save(d=>({accounts:d.accounts.map(a=>a.id===aId?{...a,tasks:{...a.tasks,[calDay]:[...(a.tasks[calDay]||[]),{id:Date.now(),text:calTask.text,time:calTask.time,done:false}]}}:a)}));
    log(aId,`Cal task: "${calTask.text.slice(0,40)}"`);
    setCalTask({text:"",time:"",accId:""});setShowCalAdd(false);
  },[calTask,calDay,save,log]);

  function handleGTask(taskText,accName){
    const full=`[AM] ${taskText} — ${accName}`;
    navigator.clipboard.writeText(full).then(()=>{
      setCopiedId(full);
      setTimeout(()=>setCopiedId(null),2000);
      window.open("https://tasks.google.com/tasks/","_blank");
    }).catch(()=>window.open("https://tasks.google.com/tasks/","_blank"));
  }

  const hourTasks=(dy,hr)=>data.accounts.flatMap(a=>(a.tasks[dy]||[]).map(t=>({...t,accName:a.name,accId:a.id}))).filter(t=>t.time&&parseInt(t.time.split(":")[0])===hr);
  const untimedTasks=dy=>data.accounts.flatMap(a=>(a.tasks[dy]||[]).map(t=>({...t,accName:a.name,accId:a.id}))).filter(t=>!t.time);
  const selDayTasks=data.accounts.flatMap(a=>(a.tasks[calDay]||[]).map(t=>({...t,accName:a.name,accId:a.id})));
  const nowH=new Date().getHours();
  const today=td();
  const days=wdays(calOff);
  const s0=sunOf(calOff),e0=new Date(s0);e0.setDate(e0.getDate()+6);
  const rl=`${s0.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e0.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
  const calLabel=calOff===0?"This week":calOff===-1?"Last week":rl;
  const DNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // Filtered insurer list — compute inline from INSURERS directly
  const filteredInsurers=INSURERS.filter(i=>{
    const matchType=insFilter==="all"
      ||(insFilter==="carrier"&&i.types.includes("carrier"))
      ||(insFilter==="tpa"&&i.types.includes("tpa"))
      ||(insFilter==="hmo"&&i.types.includes("hmo"));
    const matchSearch=!insSearch||i.name.toLowerCase().includes(insSearch.toLowerCase());
    return matchType&&matchSearch;
  });

  // Accounts using each insurer
  function accsForInsurer(insId){
    return data.accounts.filter(a=>a.carrierId===insId||a.tpaId===insId||(a.tpaIsCarrier&&a.carrierId===insId)||a.hmoId===insId);
  }

  return(
    <div style={c.root}>
      {/* Header */}
      <div style={c.hdr}>
        <div style={c.logo}>✦ AM Command</div>
        <div style={{display:"flex",gap:2}}>
          {[["overview","Overview"],["accounts","Accounts"],["insurers","Insurers"]].map(([v,l])=>(
            <button key={v} style={c.nb(view===v)} onClick={()=>{setView(v);if(v!=="accounts")setSelAcc(null);}}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={c.syncBadge(syncOk)}>{syncOk===null?"⟳ ":syncOk?"☁ ":"⚠ "}{syncMsg}</div>
          <div style={{fontSize:12,color:"#4a6080",fontWeight:600}}>{new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
        </div>
      </div>

      <div style={c.main}>
        {/* Stats */}
        <div style={c.sRow}>
          {[["Accounts",data.accounts.length,"#a78bfa"],["Open tasks",totalOpen,"#60a5fa"],["Renewals ≤60d",ren.length,"#d4880a"],["At risk",atRisk,"#e0392e"]].map(([l,v,col])=>(
            <div key={l} style={c.sc(col)}><div style={c.sn(col)}>{v}</div><div style={c.sl}>{l}</div></div>
          ))}
        </div>

        {/* ══ OVERVIEW ══ */}
        {view==="overview"&&(
          <div>
            {ren.length>0&&(
              <div style={{background:"#fffbeb",border:"1.5px solid #f6d860",borderRadius:14,padding:"12px 18px",marginBottom:14,cursor:"pointer"}} onClick={()=>setShowRen(r=>!r)}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{fontSize:13,color:"#92680a",fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>⚠ {ren.length} renewal{ren.length>1?"s":""} due within 60 days</span>
                  <span style={{fontSize:12,color:"#b08030",fontWeight:600}}>{showRen?"Hide ↑":"Show ↓"}</span>
                </div>
                {showRen&&<div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                  {ren.map(a=>{const diff=Math.ceil((new Date(a.renewalDate)-new Date())/86400000),col=diff<=30?"#e0392e":diff<=45?"#d4880a":"#7a6500",bg=diff<=30?"#fff0ef":diff<=45?"#fff8e6":"#fefce8";return(
                    <div key={a.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:bg,border:`1px solid ${col}33`,borderRadius:10,padding:"9px 13px",cursor:"pointer"}} onClick={e=>{e.stopPropagation();setSelAcc(a.id);setView("accounts");}}>
                      <div style={{display:"flex",alignItems:"center",gap:9}}><div style={c.ava(a.name)}>{ii(a.name)}</div><div><div style={{fontSize:13,fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>{a.name}</div><div style={{fontSize:11,color:"#7a9ab5"}}>Renews {new Date(a.renewalDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</div></div></div>
                      <div style={{fontSize:14,fontWeight:700,color:col,fontFamily:"'Clash Display',sans-serif"}}>{diff}d left</div>
                    </div>
                  );})}
                </div>}
              </div>
            )}

            {/* Calendar */}
            <div style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,overflow:"hidden",marginBottom:14}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid #edf2f7",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#0fa890",fontFamily:"'Clash Display',sans-serif"}}>Weekly calendar</span>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <button style={c.aBtn} onClick={()=>{setCalTask({text:"",time:"",accId:data.accounts[0]?.id?.toString()||""});setShowCalAdd(true);}}>+ Add task</button>
                  <WeekNav off={calOff} setOff={setCalOff} label={calLabel}/>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"54px repeat(7,1fr)",borderBottom:"1px solid #edf2f7"}}>
                <div style={{borderRight:"1px solid #edf2f7"}}/>
                {days.map((dy,i)=>{const it=dy===today,is=dy===calDay,oc=data.accounts.flatMap(a=>(a.tasks[dy]||[])).filter(t=>!t.done).length;return(
                  <div key={dy} onClick={()=>setCalDay(dy)} style={{padding:"8px 6px",textAlign:"center",cursor:"pointer",background:is?"#e8faf8":it?"#f0fdf8":"#fff",borderRight:i<6?"1px solid #edf2f7":"none"}}>
                    <div style={{fontSize:9,fontWeight:700,color:it?"#0fa890":"#7a9ab5",textTransform:"uppercase",letterSpacing:0.8,fontFamily:"'Clash Display',sans-serif"}}>{DNAMES[i]}</div>
                    <div style={{fontSize:18,fontWeight:700,color:is?"#0fa890":it?"#0a1628":"#c0cdd8",fontFamily:"'Clash Display',sans-serif"}}>{new Date(dy).getDate()}</div>
                    {oc>0&&<div style={{fontSize:9,color:"#0fa890",fontWeight:700}}>{oc} open</div>}
                  </div>
                );})}
              </div>
              <div style={{overflowY:"auto",maxHeight:460}}>
                {HRS.map(hr=>(
                  <div key={hr} style={{display:"grid",gridTemplateColumns:"54px repeat(7,1fr)",borderBottom:"1px solid #f0f4f8",minHeight:54}}>
                    <div style={{padding:"6px 8px 0 0",borderRight:"1px solid #edf2f7",fontSize:10,color:"#7a9ab5",fontWeight:600,textAlign:"right"}}>{fhr(hr)}</div>
                    {days.map((dy,i)=>{
                      const ts=hourTasks(dy,hr),inow=dy===today&&nowH===hr,is=dy===calDay;
                      return(
                        <div key={dy} onClick={()=>setCalDay(dy)} style={{padding:"3px 4px",borderRight:i<6?"1px solid #f0f4f8":"none",background:inow?"#f0fdf8":is?"#fafffe":"#fff",cursor:"pointer",position:"relative"}}>
                          {inow&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"#0fa890",opacity:0.6}}/>}
                          {ts.map(t=>(
                            <div key={t.id} className="task-pill" style={{background:t.done?"#f0f4f8":"#e8faf8",color:t.done?"#a0b0c0":"#0f1c2e",borderLeft:"2px solid #0fa890",textDecoration:t.done?"line-through":"none"}}>
                              {t.time} {t.text.length>10?t.text.slice(0,10)+"…":t.text}
                              <span className="task-tooltip">{t.time&&<strong>{t.time} · </strong>}{t.text}<br/><span style={{opacity:0.6,fontSize:10}}>{t.accName}</span></span>
                            </div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                ))}
                <div style={{display:"grid",gridTemplateColumns:"54px repeat(7,1fr)",background:"#fafcfe",borderTop:"1px solid #edf2f7"}}>
                  <div style={{padding:"4px 8px 4px 0",borderRight:"1px solid #edf2f7",fontSize:9,color:"#7a9ab5",fontWeight:700,textAlign:"right",textTransform:"uppercase",letterSpacing:0.5}}>No<br/>time</div>
                  {days.map((dy,i)=>{const ts=untimedTasks(dy);return(
                    <div key={dy} onClick={()=>setCalDay(dy)} style={{padding:"3px 4px",borderRight:i<6?"1px solid #f0f4f8":"none",cursor:"pointer",background:dy===calDay?"#fafffe":"#fff"}}>
                      {ts.slice(0,2).map(t=>(
                        <div key={t.id} className="task-pill" style={{background:t.done?"#f0f4f8":"#fff8e6",color:t.done?"#a0b0c0":"#0f1c2e",borderLeft:"2px solid #d4880a",textDecoration:t.done?"line-through":"none"}}>
                          {t.text.length>10?t.text.slice(0,10)+"…":t.text}
                          <span className="task-tooltip">{t.text}<br/><span style={{opacity:0.6,fontSize:10}}>{t.accName}</span></span>
                        </div>
                      ))}
                      {ts.length>2&&<div style={{fontSize:9,color:"#7a9ab5",fontWeight:600}}>+{ts.length-2}</div>}
                    </div>
                  );})}
                </div>
              </div>
            </div>

            {/* Selected day */}
            <div style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,overflow:"hidden",marginBottom:14}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid #edf2f7",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#0f1c2e",fontFamily:"'Clash Display',sans-serif"}}>{fday(calDay)}</span>
                <span style={{fontSize:12,color:"#7a9ab5",fontWeight:600}}>{selDayTasks.length} task{selDayTasks.length!==1?"s":""}</span>
              </div>
              <div style={{padding:"8px 16px 14px"}}>
                {selDayTasks.length===0?<div style={{padding:"1.5rem",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No tasks. Hit "+ Add task" above.</div>
                :[...selDayTasks].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")).map(t=>{
                  const aName=data.accounts.find(a=>a.id===t.accId)?.name||"";
                  const taskKey=`[AM] ${t.text} — ${aName}`;
                  return(
                    <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #f0f4f8",flexWrap:"wrap"}}>
                      <input type="checkbox" checked={t.done} onChange={()=>togTask(t.id,calDay,t.accId)} style={{accentColor:"#0fa890",width:15,height:15,cursor:"pointer",flexShrink:0}}/>
                      {t.time&&<span style={{fontSize:11,color:"#0fa890",fontWeight:700,background:"#e8faf8",padding:"1px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{t.time}</span>}
                      <span style={{fontSize:13,flex:1,minWidth:80,textDecoration:t.done?"line-through":"none",color:t.done?"#a0b0c0":"#0f1c2e",fontWeight:500,opacity:t.done?0.5:1}}>{t.text}</span>
                      <span onClick={()=>{setSelAcc(t.accId);setView("accounts");setTab("tasks");}} style={{fontSize:11,color:"#0fa890",background:"#e8faf8",padding:"2px 9px",borderRadius:20,cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>{t.accName}</span>
                      <a href={gcalLink(t,calDay,aName)} target="_blank" rel="noopener noreferrer" style={c.gcalBtn}>📅 GCal</a>
                      <button style={c.gtaskBtn} onClick={()=>handleGTask(t.text,aName)} title="Copies task to clipboard then opens Google Tasks">
                        {copiedId===taskKey?"✓ Copied!":"✓ GTask"}
                      </button>
                      <button style={c.del} onClick={()=>delTask(t.id,calDay,t.accId)}>✕</button>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Account health */}
            <div style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,overflow:"hidden"}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid #edf2f7",fontSize:14,fontWeight:700,color:"#0fa890",fontFamily:"'Clash Display',sans-serif"}}>Account health</div>
              <div style={{padding:"0 16px 8px"}}>
                {data.accounts.length===0?<div style={{padding:"1.5rem",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No accounts yet.</div>
                :data.accounts.map(a=>{const op=Object.values(a.tasks||{}).flat().filter(t=>!t.done).length,diff=a.renewalDate?Math.ceil((new Date(a.renewalDate)-new Date())/86400000):null;return(
                  <div key={a.id} onClick={()=>{setSelAcc(a.id);setView("accounts");}} style={{padding:"10px 0",borderBottom:"1px solid #f0f4f8",cursor:"pointer"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={c.ava(a.name)}>{ii(a.name)}</div>
                      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>{a.name}</div><div style={{fontSize:11,color:"#7a9ab5"}}>{a.poc.name} · {a.employees} emp.</div></div>
                      <div style={{textAlign:"right"}}><span style={c.badge(a.status)}>{SC[a.status]?.label}</span><div style={{fontSize:11,color:"#7a9ab5",marginTop:3}}>{op>0?`${op} open task${op>1?"s":""}`:""}{diff!==null&&diff>=0&&diff<=60?` · ${diff}d to renewal`:""}</div></div>
                    </div>
                    <InsurerTags acc={a}/>
                  </div>
                );})}
              </div>
            </div>
          </div>
        )}

        {/* ══ ACCOUNTS ══ */}
        {view==="accounts"&&(
          <div style={c.grid}>
            <div style={c.sidebar}>
              <div style={c.sHead}><span style={c.sTitle}>Accounts</span><button style={c.aBtn} onClick={()=>{setForm(flatA(eAcc()));setShowAdd(true);}}>+ Add</button></div>
              <div style={{padding:"8px 10px"}}><input style={c.srch} placeholder="Search accounts…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
              {fAccs.length===0&&<div style={{padding:"1rem",textAlign:"center",color:"#c0cdd8",fontSize:13}}>{search?"No results.":"No accounts yet."}</div>}
              {fAccs.map(a=>(
                <div key={a.id} style={c.ai(selAcc===a.id)} onClick={()=>setSelAcc(a.id)}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:SC[a.status]?.text,flexShrink:0}}/>
                  <div style={c.ava(a.name)}>{ii(a.name)}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",fontFamily:"'Clash Display',sans-serif"}}>{a.name}</div>
                    <div style={{fontSize:11,color:"#7a9ab5"}}>{a.industry}</div>
                  </div>
                </div>
              ))}
            </div>

            {!acc?<div style={{...c.panel,padding:"3rem",textAlign:"center",color:"#c0cdd8"}}>Select an account.</div>:(
              <div style={c.panel}>
                <div style={c.pH}>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{...c.ava(acc.name),width:38,height:38,fontSize:13}}>{ii(acc.name)}</div>
                    <div><div style={{fontSize:15,fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>{acc.name}</div><div style={{fontSize:12,color:"#7a9ab5"}}>{acc.industry}</div></div>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button style={c.aBtn} onClick={()=>{setForm(flatA(acc));setShowEdit(true);}}>Edit</button>
                    <button style={{...c.aBtn,color:"#e0392e",borderColor:"#e0392e44",background:"#fff0ef"}} onClick={()=>delAcc(acc.id)}>Delete</button>
                  </div>
                </div>

                {/* Stats */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:"14px 18px"}}>
                  {[["Employees",acc.employees.toLocaleString()],["Status",null],["Renewal",acc.renewalDate?new Date(acc.renewalDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—"],["Days left",acc.renewalDate?Math.max(0,Math.ceil((new Date(acc.renewalDate)-new Date())/86400000))+"d":"—"]].map(([l,v])=>(
                    <div key={l} style={c.ic}><div style={c.iL}>{l}</div>{l==="Status"?<div style={{marginTop:4}}><span style={c.badge(acc.status)}>{SC[acc.status]?.label}</span></div>:<div style={c.iV}>{v}</div>}</div>
                  ))}
                </div>

                {/* Insurance setup card */}
                {(acc.carrierId||acc.tpaId||acc.hmoId)&&(
                  <div style={{margin:"0 18px 14px",background:"#f0f6ff",border:"1px solid #c7dcff",borderRadius:12,padding:14}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#4285f4",textTransform:"uppercase",letterSpacing:0.8,marginBottom:10}}>Insurance Setup</div>
                    <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                      {acc.carrierId&&INSURER_BY_ID[acc.carrierId]&&(()=>{const ins=INSURER_BY_ID[acc.carrierId];return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #c7dcff",borderRadius:10,padding:"8px 12px",minWidth:130}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#4285f4",textTransform:"uppercase",letterSpacing:0.5}}>Risk Carrier</div><div style={{fontSize:12,fontWeight:700,color:"#0f1c2e"}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#4285f4",textDecoration:"none"}}>Visit website →</a>}</div>
                        </div>
                      );})()}
                      {(acc.tpaIsCarrier?acc.carrierId:acc.tpaId)&&(()=>{const ins=acc.tpaIsCarrier?INSURER_BY_ID[acc.carrierId]:INSURER_BY_ID[acc.tpaId];if(!ins)return null;return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #b2f0df",borderRadius:10,padding:"8px 12px",minWidth:130}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#0fa890",textTransform:"uppercase",letterSpacing:0.5}}>TPA{acc.tpaIsCarrier?" (= Carrier)":""}</div><div style={{fontSize:12,fontWeight:700,color:"#0f1c2e"}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#0fa890",textDecoration:"none"}}>Visit website →</a>}</div>
                        </div>
                      );})()}
                      {acc.hmoId&&INSURER_BY_ID[acc.hmoId]&&(()=>{const ins=INSURER_BY_ID[acc.hmoId];return(
                        <div style={{display:"flex",alignItems:"center",gap:8,background:"#fff",border:"1px solid #e9c7ff",borderRadius:10,padding:"8px 12px",minWidth:130}}>
                          <InsurerLogo ins={ins}/>
                          <div><div style={{fontSize:9,fontWeight:700,color:"#9333ea",textTransform:"uppercase",letterSpacing:0.5}}>HMO</div><div style={{fontSize:12,fontWeight:700,color:"#0f1c2e"}}>{ins.name}</div>{ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:"#9333ea",textDecoration:"none"}}>Visit website →</a>}</div>
                        </div>
                      );})()}
                    </div>
                  </div>
                )}

                {/* POC */}
                <div style={{margin:"0 18px 14px",background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:12,padding:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                    <div style={{...c.ava(acc.poc.name||"?"),width:44,height:44,fontSize:14}}>{ii(acc.poc.name||"?")}</div>
                    <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,fontFamily:"'Clash Display',sans-serif"}}>{acc.poc.name||"—"}</div><div style={{fontSize:12,color:"#7a9ab5"}}>{acc.poc.title||"—"}</div></div>
                    <div style={{display:"flex",gap:6}}>
                      {acc.poc.email&&<a href={`mailto:${acc.poc.email}`} style={{background:"#e8faf8",border:"1px solid #5dd8c844",color:"#0fa890",borderRadius:8,padding:"5px 11px",fontSize:12,fontWeight:700,textDecoration:"none"}}>✉ Email</a>}
                      {acc.poc.emailThreadUrl&&<a href={acc.poc.emailThreadUrl} target="_blank" rel="noopener noreferrer" style={{background:"#0a1628",border:"1px solid #162240",color:"#5dd8c8",borderRadius:8,padding:"5px 11px",fontSize:12,fontWeight:700,textDecoration:"none"}}>📬 Inbox</a>}
                    </div>
                  </div>
                  {[["Phone",acc.poc.phone,null],["Email",acc.poc.email,acc.poc.email?`mailto:${acc.poc.email}`:null]].map(([l,v,href])=>(
                    <div key={l} style={{fontSize:12,color:"#7a9ab5",padding:"6px 0",borderTop:"1px solid #edf2f7",display:"flex",gap:8}}>
                      <span style={{color:"#c0cdd8",minWidth:42,fontWeight:600}}>{l}</span>
                      {href?<a href={href} style={{color:"#0fa890",fontWeight:600,textDecoration:"none"}}>{v||"—"}</a>:<span style={{color:"#0f1c2e",fontWeight:500}}>{v||"—"}</span>}
                    </div>
                  ))}
                </div>

                {/* Subsidiaries */}
                <div style={{margin:"0 18px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#7a9ab5",textTransform:"uppercase",letterSpacing:0.8}}>Subsidiaries ({(acc.subsidiaries||[]).length})</span>
                    <button style={c.aBtn} onClick={()=>setShowSub(true)}>+ Add</button>
                  </div>
                  {(acc.subsidiaries||[]).length===0?<div style={{background:"#f7fbff",border:"1px dashed #dde8f0",borderRadius:10,padding:12,textAlign:"center",color:"#c0cdd8",fontSize:12}}>No subsidiaries yet.</div>
                  :(acc.subsidiaries||[]).map(s=>(
                    <div key={s.id} style={{background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:10,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",gap:10}}>
                      <div style={{...c.ava(s.name),width:30,height:30,fontSize:10}}>{ii(s.name)}</div>
                      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{s.name}</div><div style={{fontSize:11,color:"#7a9ab5"}}>{s.employees>0?`${s.employees} emp.`:""}{s.poc?` · ${s.poc}`:""}</div></div>
                      {s.pocEmail&&<a href={`mailto:${s.pocEmail}`} style={{fontSize:11,color:"#0fa890",fontWeight:700,textDecoration:"none",background:"#e8faf8",padding:"2px 8px",borderRadius:20}}>✉</a>}
                      <button style={c.del} onClick={()=>delSub(s.id)}>✕</button>
                    </div>
                  ))}
                </div>

                <div style={c.tabs}>
                  {[["notes","Weekly Notes"],["tasks","Daily Tasks"],["activity","Activity Log"]].map(([t,l])=>(
                    <button key={t} style={c.tab(tab===t)} onClick={()=>setTab(t)}>{l}</button>
                  ))}
                </div>

                {tab==="notes"&&(
                  <div style={{padding:18}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <span style={{fontSize:13,fontWeight:600}}>Week notes</span>
                      <WeekNav off={nOff} setOff={setNOff} label={nOff===0?"This week":nOff===-1?"Last week":nOff<0?`${Math.abs(nOff)}w ago`:`${nOff}w ahead`}/>
                    </div>
                    <NoteInput value={note} onChange={chNote} onSave={saveNote}/>
                    {(acc.notes[nwk]||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No notes this week.</div>
                    :[...(acc.notes[nwk]||[])].reverse().map(n=>(
                      <div key={n.id} style={{background:"#f7fbff",border:"1px solid #edf2f7",borderRadius:8,padding:12,marginTop:8,position:"relative"}}>
                        <button style={c.del} onClick={()=>delNote(n.id)}>✕</button>
                        <div style={{fontSize:13,lineHeight:1.65,color:"#0f1c2e",paddingRight:20}}>{n.text}</div>
                        <div style={{fontSize:11,color:"#c0cdd8",marginTop:5}}>{new Date(n.ts).toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"})}</div>
                      </div>
                    ))}
                  </div>
                )}

                {tab==="tasks"&&(
                  <div style={{padding:18}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <span style={{fontSize:13,fontWeight:600}}>{fday(dky)}</span>
                      <WeekNav off={dOff} setOff={setDOff} label={dOff===0?"Today":dOff===1?"Tomorrow":dOff===-1?"Yesterday":dOff<0?`${Math.abs(dOff)}d ago`:`In ${dOff}d`}/>
                    </div>
                    <TaskInput value={task} timeValue={taskTime} onChange={chTask} onTimeChange={chTaskTime} onAdd={addTask}/>
                    {(acc.tasks[dky]||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No tasks for this day.</div>
                    :[...(acc.tasks[dky]||[])].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")).map(t=>{
                      const taskKey=`[AM] ${t.text} — ${acc.name}`;
                      return(
                        <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #f0f4f8",opacity:t.done?0.45:1,flexWrap:"wrap"}}>
                          <input type="checkbox" checked={t.done} onChange={()=>togTask(t.id)} style={{accentColor:"#0fa890",width:15,height:15,cursor:"pointer",flexShrink:0}}/>
                          {t.time&&<span style={{fontSize:11,color:"#0fa890",fontWeight:700,background:"#e8faf8",padding:"1px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{t.time}</span>}
                          <span style={{fontSize:13,flex:1,minWidth:60,textDecoration:t.done?"line-through":"none",color:t.done?"#c0cdd8":"#0f1c2e",fontWeight:500}}>{t.text}</span>
                          <a href={gcalLink(t,dky,acc.name)} target="_blank" rel="noopener noreferrer" style={c.gcalBtn}>📅 GCal</a>
                          <button style={c.gtaskBtn} onClick={()=>handleGTask(t.text,acc.name)}>
                            {copiedId===taskKey?"✓ Copied!":"✓ GTask"}
                          </button>
                          <button style={c.del} onClick={()=>delTask(t.id)}>✕</button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {tab==="activity"&&(
                  <div style={{padding:18}}>
                    <div style={{fontSize:13,fontWeight:600,marginBottom:12,color:"#7a9ab5"}}>Activity & task log</div>
                    {(acc.activity||[]).length===0?<div style={{padding:"1rem 0",textAlign:"center",color:"#c0cdd8",fontSize:13}}>No activity yet.</div>
                    :(acc.activity||[]).map(a=>(
                      <div key={a.id} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:"1px solid #f0f4f8",alignItems:"flex-start"}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:"#edf2f7",border:"1.5px solid #5dd8c8",marginTop:5,flexShrink:0}}/>
                        <div style={{flex:1}}><div style={{fontSize:13,color:"#0f1c2e",fontWeight:500}}>{a.msg}</div><div style={{fontSize:11,color:"#c0cdd8",marginTop:2}}>{new Date(a.ts).toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"})}</div></div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* ══ INSURERS ══ */}
        {view==="insurers"&&(
          <div>
            {/* Filter bar */}
            <div style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,padding:"14px 18px",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <input style={{...c.srch,marginBottom:0,maxWidth:260}} placeholder="Search insurers…" value={insSearch} onChange={e=>setInsSearch(e.target.value)}/>
                <div style={{display:"flex",gap:6}}>
                  {[["all","All"],["carrier","Risk Carriers"],["tpa","TPAs"],["hmo","HMOs"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setInsFilter(v)} style={{background:insFilter===v?"#0a1628":"#f0f4f8",color:insFilter===v?"#5dd8c8":"#7a9ab5",border:"none",borderRadius:8,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{l}</button>
                  ))}
                </div>
                <span style={{fontSize:12,color:"#7a9ab5",marginLeft:"auto"}}>{filteredInsurers.length} insurer{filteredInsurers.length!==1?"s":""}</span>
              </div>
            </div>

            {/* Stats row */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              {[["Risk Carriers",INSURERS.filter(i=>i.types.includes("carrier")).length,"#4285f4"],["TPAs",INSURERS.filter(i=>i.types.includes("tpa")).length,"#0fa890"],["HMOs",INSURERS.filter(i=>i.types.includes("hmo")).length,"#9333ea"]].map(([l,v,col])=>(
                <div key={l} style={{background:"#fff",border:`1.5px solid ${col}44`,borderRadius:14,padding:"14px 18px"}}>
                  <div style={{fontSize:22,fontWeight:700,color:col,fontFamily:"'Clash Display',sans-serif"}}>{v}</div>
                  <div style={{fontSize:11,color:"#7a9ab5",marginTop:2,textTransform:"uppercase",letterSpacing:0.8,fontWeight:600}}>{l}</div>
                </div>
              ))}
            </div>

            {/* Insurer grid */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
              {filteredInsurers.map(ins=>{
                const linked=accsForInsurer(ins.id);
                return(
                  <div key={ins.id} style={{background:"#fff",border:"1px solid #dde8f0",borderRadius:14,padding:16,display:"flex",flexDirection:"column",gap:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <InsurerLogo ins={ins}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:14,fontWeight:700,fontFamily:"'Clash Display',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ins.name}</div>
                        <div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>
                          {ins.types.map(t=><span key={t} style={c.typeTag(t)}>{t==="carrier"?"Risk Carrier":t==="tpa"?"TPA":"HMO"}</span>)}
                        </div>
                      </div>
                      {ins.url&&<a href={ins.url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#4285f4",fontWeight:700,textDecoration:"none",background:"#e8f0fe",padding:"3px 9px",borderRadius:20,whiteSpace:"nowrap",flexShrink:0}}>Website →</a>}
                    </div>
                    {linked.length>0&&(
                      <div>
                        <div style={{fontSize:10,fontWeight:700,color:"#7a9ab5",textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Linked accounts ({linked.length})</div>
                        <div style={{display:"flex",flexDirection:"column",gap:4}}>
                          {linked.map(a=>(
                            <div key={a.id} onClick={()=>{setSelAcc(a.id);setView("accounts");}} style={{display:"flex",alignItems:"center",gap:8,background:"#f7fbff",borderRadius:8,padding:"6px 10px",cursor:"pointer",border:"1px solid #edf2f7"}}>
                              <div style={{...c.ava(a.name),width:22,height:22,fontSize:8}}>{ii(a.name)}</div>
                              <span style={{fontSize:12,fontWeight:600,color:"#0f1c2e"}}>{a.name}</span>
                              <span style={{...c.badge(a.status),fontSize:9,padding:"1px 7px",marginLeft:"auto"}}>{SC[a.status]?.label}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {linked.length===0&&<div style={{fontSize:11,color:"#c0cdd8",textAlign:"center",padding:"6px 0"}}>No accounts linked yet</div>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* Modals */}
      {showAdd&&<AccModal title="Add new account" d={form} ch={chForm} onSave={addAcc} onClose={()=>setShowAdd(false)}/>}
      {showEdit&&<AccModal title={`Edit · ${acc?.name}`} d={form} ch={chForm} onSave={updAcc} onClose={()=>setShowEdit(false)}/>}
      {showCalAdd&&<CalAddModal day={calDay} accounts={data.accounts} ct={calTask} ch={chCal} onSave={addCalTask} onClose={()=>setShowCalAdd(false)}/>}
      {showSub&&(
        <div style={c.modal} onClick={e=>e.target===e.currentTarget&&setShowSub(false)}>
          <div style={{...c.mBox,width:400}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:4,fontFamily:"'Clash Display',sans-serif"}}>Add Subsidiary</div>
            <div style={{fontSize:12,color:"#7a9ab5",marginBottom:16}}>Under {acc?.name}</div>
            {[["Subsidiary name","name","text"],["Employees","employees","number"],["POC name","poc","text"],["POC email","pocEmail","email"],["POC phone","pocPhone","text"]].map(([lb,k,t])=>(
              <div key={k}><label style={c.fl}>{lb}</label><input style={c.fi} type={t} value={subForm[k]} onChange={e=>setSubForm(f=>({...f,[k]:e.target.value}))}/></div>
            ))}
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:10}}>
              <button style={c.cBtn} onClick={()=>setShowSub(false)}>Cancel</button>
              <button style={c.sv} onClick={addSub}>Add</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard/>);
</script>
</body>
</html>
